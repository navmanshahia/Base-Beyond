name: Build cPanel production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout cPanel branch
        uses: actions/checkout@v4
        with:
          ref: cpanel
          path: deploy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build website
        working-directory: source
        run: npm run build

      - name: Update deployable files
        run: |
          find deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R source/dist/. deploy/
          cp source/.htaccess deploy/.htaccess
          cat > deploy/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=$HOME/public_html/BaseBeyond/
              - /bin/mkdir -p $DEPLOYPATH
              - /bin/cp index.html $DEPLOYPATH
              - /bin/cp .htaccess $DEPLOYPATH
              - /bin/rm -rf $DEPLOYPATH/assets
              - /bin/cp -R assets $DEPLOYPATH
          EOF

      - name: Commit production build
        working-directory: deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build cPanel website from $GITHUB_SHA"
            git push origin cpanel
          fi
