name: Build cPanel production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Prepare production branch
        run: |
          mkdir -p /tmp/base-beyond-production
          cp -R dist/. /tmp/base-beyond-production/
          cp .htaccess /tmp/base-beyond-production/.htaccess
          cat > /tmp/base-beyond-production/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=$HOME/public_html/BaseBeyond/
              - /bin/mkdir -p $DEPLOYPATH
              - /bin/cp index.html $DEPLOYPATH
              - /bin/cp .htaccess $DEPLOYPATH
              - /bin/rm -rf $DEPLOYPATH/assets
              - /bin/cp -R assets $DEPLOYPATH
          EOF
          cd /tmp/base-beyond-production
          git init
          git checkout -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build production website from $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin production
